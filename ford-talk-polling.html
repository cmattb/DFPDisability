.`,Ga=[{position:`1`,positionText:`Rank 1`,label:`Economic Relief`,net:7.1,disabledNet:7.2,notDisabledNet:7.1,statement:`Child care is often one of the biggest expenses for families. Capping child care costs at 7% of household income would provide critical financial relief to working families. No parent should have to choose between affording child care and paying for essentials like housing and groceries.`},{position:`2`,positionText:`Rank 2`,label:`Help Working-Class`,net:5.6,disabledNet:5.6,notDisabledNet:5.6,statement:`Middle- and working-class families are hit hardest by rising child care costs. This law would provide much-needed support, allowing parents to work and support their families without being overwhelmed by the burden of child care expenses.`},{position:`3`,positionText:`Rank 3`,label:`Childhood Development`,net:4.6,disabledNet:4.5,notDisabledNet:4.6,statement:`Affordable child care ensures that all children, regardless of their family's income, have access to high-quality early education. This law would help give every child a strong start by making sure families can afford safe, enriching child care.`},{position:`4`,positionText:`Rank 4`,label:`Gender Equality`,net:2.1,disabledNet:2.1,notDisabledNet:2.1,statement:`Women are often forced to leave the workforce because of high child care costs. By ensuring that no family spends more than 7% of their income on child care, this law would help close the gender wage gap and increase economic opportunities for women.`},{position:`5`,positionText:`Rank 5`,label:`Economic Equality`,net:1.6,disabledNet:1.7,notDisabledNet:1.6,statement:`Child care costs disproportionately affect low-income families, limiting their ability to get ahead. By capping child care expenses at 7% of household income, this law would promote economic equality and help reduce the wealth gap.`},{position:`6`,positionText:`Rank 6`,label:`Business Productivity`,net:1.4,disabledNet:1.4,notDisabledNet:1.4,statement:`Businesses thrive when em
