ity`,net:2.1,disabledNet:2.1,notDisabledNet:2.1,statement:`Women are often forced to leave the workforce because of high child care costs. By ensuring that no family spends more than 7% of their income on child care, this law would help close the gender wage gap and increase economic opportunities for women.`},{position:`5`,positionText:`Rank 5`,label:`Economic Equality`,net:1.6,disabledNet:1.7,notDisabledNet:1.6,statement:`Child care costs disproportionately affect low-income families, limiting their ability to get ahead. By capping child care expenses at 7% of household income, this law would promote economic equality and help reduce the wealth gap.`},{position:`6`,positionText:`Rank 6`,label:`Business Productivity`,net:1.4,disabledNet:1.4,notDisabledNet:1.4,statement:`Businesses thrive when employees are supported. Affordable child care allows workers to focus on their jobs without constantly worrying about high child care costs, leading to higher productivity.`},{position:`7`,positionText:`Rank 7`,label:`Boosting Local Economies`,net:.9,disabledNet:1,notDisabledNet:.8,statement:`When families can afford child care, they have more disposable income to spend in their communities. Capping child care costs would boost local economies by allowing parents to reinvest in housing, education, and local businesses.`},{position:`8`,positionText:`Rank 8`,label:`Child Care Workforce`,net:.8,disabledNet:.7,notDisabledNet:.8,statement:`Investment in child care creates good jobs for child care workers, many of whom are underpaid and struggle to make ends meet. By improving wages, we can grow the child care workforce and expand access to quality care for families.`},{position:`9–10`,positionText:`Positions 9 through 10; same displayed score as Global Competitiveness`,label:`Infrastructure`,net:-1.4,disabledNet:-1.4,notDisabledNet:-1.4,statement:`Child care is critical economic infrastructure. Just like roads and bridges and ports and trains drive America's economic growth, child
